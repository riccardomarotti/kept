name: Build and publish Docker image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute image tags from branch name
        id: image_tags
        shell: bash
        run: |
          set -euo pipefail
          branch_tag="$(printf '%s' "$GITHUB_REF_NAME" | LC_ALL=C tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')"
          if [[ -z "$branch_tag" ]]; then
            echo "Could not create a valid Docker tag from branch name" >&2
            exit 1
          fi
          {
            echo 'tags<<EOF'
            echo "ghcr.io/riccardomarotti/kept:${branch_tag}"
            echo "ghcr.io/riccardomarotti/kept:sha-${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == 'refs/heads/master' ]]; then
              echo 'ghcr.io/riccardomarotti/kept:latest'
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/riccardomarotti/kept
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
